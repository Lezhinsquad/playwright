apiVersion: apps/v1
kind: Deployment
metadata:
  name: beta-wasp
  namespace: prod-service-maintenance
  labels:
    app: beta-wasp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beta-wasp
  template:
    metadata:
      labels:
        app: beta-wasp
    spec:
      imagePullSecrets:
      - name: docker
      containers:
      - env:
        - name: env
          value: beta
        envFrom:
          - secretRef:
              name: beta-secret
        name: beta-wasp
        image: docker.lezhin.com/wasp:TAG_ID
        ports:
        - containerPort: 8000
          name: 8000tcp1
          protocol: TCP
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 2Gi
