apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-celery
  namespace: prod-service-maintenance
  labels:
    app: prod-celery
spec:
  replicas: 3
  selector:
    matchLabels:
      app: prod-celery
  template:
    metadata:
      labels:
        app: prod-celery
    spec:
      imagePullSecrets:
      - name: docker
      containers:
      - env:
        - name: env
          value: prod
        envFrom:
          - secretRef:
              name: prod-secret
        name: prod-celery
        image: docker.lezhin.com/celery:TAG_ID
        # ports:
        # - containerPort: 8000
        #   name: 8000tcp1
        #   protocol: TCP
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 2Gi
